name: Mobile CI Pipeline with Hold Gates

on:
  pull_request:

jobs:
  eslint:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - name: Sleep for 2 seconds
        run: sleep 2
      - name: Dummy ESLint
        run: echo "✅ ESLint Passed"

  # iOS EXPERIMENTAL
  ios-hold-build-experimental:
    needs: eslint
    runs-on: ubuntu-latest
    environment: ios_hold_build_experimental
    steps:
      - run: echo "🛑 Hold: iOS Experimental Build Approved"

  ios-build-experimental:
    needs: ios-hold-build-experimental
    runs-on: ubuntu-latest
    steps:
      - run: echo "🏗️ Building iOS Experimental"

  ios-upload-experimental:
    needs: ios-build-experimental
    runs-on: ubuntu-latest
    steps:
      - run: echo "📤 Uploading iOS Experimental"

  # iOS OFFICIAL
  ios-hold-build-official:
    needs: eslint
    runs-on: ubuntu-latest
    environment: ios_hold_build_official
    steps:
      - run: echo "🛑 Hold: iOS Official Build Approved"

  ios-build-official:
    needs: ios-hold-build-official
    runs-on: ubuntu-latest
    steps:
      - run: echo "🏗️ Building iOS Official"

  ios-hold-upload-official:
    needs: ios-build-official
    runs-on: ubuntu-latest
    environment: ios_hold_upload_official
    steps:
      - run: echo "🛑 Hold: iOS Upload Approved"

  ios-upload-official:
    needs: ios-hold-upload-official
    runs-on: ubuntu-latest
    steps:
      - run: echo "🚀 Uploaded iOS Official"

  # ANDROID EXPERIMENTAL
  android-hold-build-experimental:
    needs: eslint
    runs-on: ubuntu-latest
    environment: android_hold_build_experimental
    steps:
      - run: echo "🛑 Hold: Android Experimental Build Approved"

  android-build-experimental:
    needs: android-hold-build-experimental
    runs-on: ubuntu-latest
    steps:
      - run: echo "🏗️ Building Android Experimental"

  android-upload-experimental:
    needs: android-build-experimental
    runs-on: ubuntu-latest
    steps:
      - run: echo "📤 Uploading Android Experimental"

  # ANDROID OFFICIAL
  android-hold-build-official:
    needs: eslint
    runs-on: ubuntu-latest
    environment: android_hold_build_official
    steps:
      - run: echo "🛑 Hold: Android Official Build Approved"

  android-build-official:
    needs: android-hold-build-official
    runs-on: ubuntu-latest
    steps:
      - run: echo "🏗️ Building Android Official"

  android-hold-upload-official:
    needs: android-build-official
    runs-on: ubuntu-latest
    environment: android_hold_upload_official
    steps:
      - run: echo "🛑 Hold: Android Upload Approved"

  android-upload-official:
    needs: android-hold-upload-official
    runs-on: ubuntu-latest
    steps:
      - run: echo "🚀 Uploaded Android Official"
